version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      # These will be read from the .env file on the server
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - PORT=5000
    volumes:
      - vector_data:/app/data
      - model_cache:/root/.djl.ai
      - onnx_cache:/tmp/spring-ai-onnx-generative
    restart: always

  chroma:
    image: chromadb/chroma:0.5.23
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/ssl/cloudflare:/etc/nginx/ssl:ro
    restart: always

volumes:
  vector_data:
  chroma_data:
  model_cache:
  onnx_cache:
